name: Daily Website Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run website health check
        id: healthcheck
        continue-on-error: true
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teknokurgu-health-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtppro.zoho.eu
          server_port: 465
          secure: true
          username: ${{ secrets.ZOHO_SMTP_USER }}
          password: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          subject: >-
            ${{ steps.healthcheck.outcome == 'success' && 'SUCCESS' || 'FAILED' }}
            - Tekno Kurgu Website Health Check
          to: korhan.yuzbasioglu@teknokurgu.com.tr
          from: sendmail@teknokurgu.com.tr
          body: |
            TEKNO KURGU - DAILY WEBSITE HEALTH CHECK

            Test result: ${{ steps.healthcheck.outcome }}

            Repository: ${{ github.repository }}

            Detailed report:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This report was generated automatically by GitHub Actions.

      - name: Mark workflow as failed if health check failed
        if: steps.healthcheck.outcome == 'failure'
        run: exit 1
